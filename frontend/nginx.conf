server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Attachments are capped at 10 MB by the API; nginx's 1 MB default would
  # reject larger uploads with 413 before they reach it.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Stream downloads/uploads instead of buffering them in nginx.
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location /socket.io/ {
    proxy_pass http://backend:8000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri /index.html;
  }
}