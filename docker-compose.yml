name: visualboard

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visualboard
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Override when a local Postgres already uses 5432: DB_HOST_PORT=5433
      - '${DB_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/visualboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-in-prod}
      FRONTEND_ORIGIN: http://localhost:5174
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/uploads
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-20}
      RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-200}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - '5174:80'

volumes:
  db_data:
  uploads_data:
